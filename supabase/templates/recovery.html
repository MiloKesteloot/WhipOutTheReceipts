<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f9fafb;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;">
        <tr>
          <td style="padding:0 0 16px;text-align:center;font-size:22px;font-weight:700;color:#111827;">Receipts</td>
        </tr>
        <tr>
          <td style="background:#ffffff;border:1px solid #e5e7eb;border-radius:16px;padding:32px 28px;">
            <h1 style="margin:0 0 8px;font-size:20px;font-weight:600;color:#111827;">Reset your password</h1>
            <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#4b5563;">
              We got a request to reset your password. Tap the button below to choose a new one.
            </p>
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td style="border-radius:12px;background:#16a34a;">
                  <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery"
                     style="display:inline-block;padding:12px 24px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:12px;">
                    Choose a new password
                  </a>
                </td>
              </tr>
            </table>
            <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#9ca3af;">
              Button not working? <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery" style="color:#16a34a;">Use this link instead</a>.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 8px 0;text-align:center;font-size:12px;line-height:1.5;color:#9ca3af;">
            If you didn't ask to reset your password, you can ignore this email. Your password won't change.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
